name: Build Kyoto APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          mkdir -p Kyoto && cd Kyoto
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.boltoverlay"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.boltoverlay"
                  minSdk = 26
                  targetSdk = 33
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application android:label="Kyoto" android:theme="@android:style/Theme.Material.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".PillService" android:exported="false" />
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/java/com/example/boltoverlay
          cat > app/src/main/java/com/example/boltoverlay/MainActivity.kt <<'EOF_FILE'
          package com.example.boltoverlay

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.*

          class MainActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val prefs = getSharedPreferences("kyoto", MODE_PRIVATE)
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(pad, pad, pad, pad) }

                  fun send(action: String?) {
                      val i = Intent(this, PillService::class.java)
                      if (action != null) i.action = action
                      startForegroundService(i)
                  }
                  fun btn(t: String, f: () -> Unit) = Button(this).apply { text = t; setOnClickListener { f() } }

                  root.addView(TextView(this).apply { text = "Kyoto"; textSize = 26f })
                  root.addView(TextView(this).apply {
                      text = "Type a price and tap Show. When the pill has a blue outline you can drag it anywhere. Tap it (without dragging) to come back here and edit."
                      setPadding(0, pad / 2, 0, pad / 2)
                  })

                  root.addView(btn("1. Allow display over other apps") {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  })

                  val price = EditText(this).apply {
                      hint = "Price, e.g. €7.08"
                      setText(prefs.getString("text", ""))
                      setSingleLine()
                  }
                  root.addView(price)

                  root.addView(btn("2. Show pill") {
                      val t = price.text.toString().trim()
                      if (t.isEmpty()) { Toast.makeText(this, "Type a price first", Toast.LENGTH_SHORT).show(); return@btn }
                      prefs.edit().putString("text", t).putBoolean("shown", true).apply()
                      if (!Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "Allow 'Display over other apps' first", Toast.LENGTH_LONG).show()
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                          return@btn
                      }
                      send("kyoto.SHOW")
                  })
                  root.addView(btn("Hide pill") { send(PillService.ACTION_HIDE) })

                  val lock = CheckBox(this).apply {
                      text = "Lock position (touches go through to the app below)"
                      isChecked = prefs.getBoolean("locked", false)
                      setOnCheckedChangeListener { _, c ->
                          prefs.edit().putBoolean("locked", c).apply()
                          send("kyoto.UPDATE")
                      }
                  }
                  root.addView(lock)
                  root.addView(btn("Reset position") { send(PillService.ACTION_RESET) })

                  setContentView(ScrollView(this).apply { addView(root) })
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/example/boltoverlay
          cat > app/src/main/java/com/example/boltoverlay/PillService.kt <<'EOF_FILE'
          package com.example.boltoverlay

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.IBinder
          import android.text.SpannableString
          import android.text.style.ForegroundColorSpan
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.widget.TextView
          import android.widget.Toast
          import kotlin.math.abs

          class PillService : Service() {
              private lateinit var wm: WindowManager
              private var pill: TextView? = null
              private var lp: WindowManager.LayoutParams? = null

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onBind(i: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("kyoto", "Kyoto", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "kyoto")
                      .setContentTitle("Kyoto is running")
                      .setSmallIcon(android.R.drawable.ic_menu_info_details)
                      .build()
                  startForeground(1, n)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val prefs = getSharedPreferences("kyoto", MODE_PRIVATE)
                  when (intent?.action) {
                      ACTION_HIDE -> {
                          prefs.edit().putBoolean("shown", false).apply()
                          removePill(); stopSelf(); return START_NOT_STICKY
                      }
                      ACTION_RESET -> prefs.edit().remove("x").remove("y").apply()
                  }
                  if (prefs.getBoolean("shown", false)) {
                      render()
                  } else {
                      removePill(); stopSelf(); return START_NOT_STICKY
                  }
                  return START_STICKY
              }

              private fun removePill() {
                  pill?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  pill = null
              }

              private fun render() {
                  removePill()
                  val prefs = getSharedPreferences("kyoto", MODE_PRIVATE)
                  val text = prefs.getString("text", "") ?: ""
                  val locked = prefs.getBoolean("locked", false)
                  val dm = resources.displayMetrics

                  val sp = SpannableString(text)
                  if (text.isNotEmpty() && text[0] in "€$£") {
                      sp.setSpan(ForegroundColorSpan(Color.parseColor("#22DD55")), 0, 1, 0)
                  }
                  val tv = TextView(this).apply {
                      this.text = sp
                      textSize = 24f
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                      setPadding(dp(22), dp(8), dp(22), dp(8))
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#E6222222"))
                          cornerRadius = dp(30).toFloat()
                          if (!locked) setStroke(dp(2), Color.parseColor("#4DA3FF")) // blue outline = you can drag it
                      }
                  }

                  var flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                  if (locked) flags = flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE // touches pass through

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, flags, PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = prefs.getInt("x", dm.widthPixels / 2 - dp(60))
                      y = prefs.getInt("y", dm.heightPixels * 12 / 100)
                  }

                  if (!locked) {
                      var startX = 0; var startY = 0
                      var downX = 0f; var downY = 0f
                      var moved = false
                      tv.setOnTouchListener { v, e ->
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  startX = params.x; startY = params.y
                                  downX = e.rawX; downY = e.rawY; moved = false
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val ox = (e.rawX - downX).toInt(); val oy = (e.rawY - downY).toInt()
                                  if (abs(ox) > dp(6) || abs(oy) > dp(6)) moved = true
                                  params.x = startX + ox; params.y = startY + oy
                                  try { wm.updateViewLayout(v, params) } catch (_: Exception) {}
                              }
                              MotionEvent.ACTION_UP -> {
                                  if (moved) {
                                      prefs.edit().putInt("x", params.x).putInt("y", params.y).apply()
                                  } else {
                                      startActivity(Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                                  }
                              }
                          }
                          true
                      }
                  }

                  try {
                      wm.addView(tv, params)
                      pill = tv; lp = params
                  } catch (_: Exception) {
                      Toast.makeText(this, "Please allow 'Display over other apps' for Kyoto", Toast.LENGTH_LONG).show()
                      stopSelf()
                  }
              }

              override fun onDestroy() { removePill(); super.onDestroy() }

              companion object {
                  const val ACTION_HIDE = "kyoto.HIDE"
                  const val ACTION_RESET = "kyoto.RESET"
              }
          }
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Kyoto"
          include(":app")
          EOF_FILE
      - name: Build
        working-directory: Kyoto
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Kyoto-apk
          path: Kyoto/app/build/outputs/apk/debug/app-debug.apk
