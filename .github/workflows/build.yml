name: Build Kyoto APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          mkdir -p Kyoto && cd Kyoto
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.boltoverlay"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.boltoverlay"
                  minSdk = 26
                  targetSdk = 33
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application android:label="Kyoto" android:theme="@android:style/Theme.Material.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".PillService" android:exported="false" />
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/java/com/example/boltoverlay
          cat > app/src/main/java/com/example/boltoverlay/Cfg.kt <<'EOF_FILE'
          package com.example.boltoverlay

          import android.graphics.Color
          import java.util.Locale

          object Cfg {
              const val FILE = "kyoto"

              class Theme(val name: String, val bg1: Int, val bg2: Int, val text: Int, val muted: Int, val stroke: Int)

              val themes = listOf(
                  Theme("Midnight", Color.parseColor("#FF15151A"), Color.parseColor("#FF2A2A35"), Color.parseColor("#FFFFFFFF"), Color.parseColor("#FFA0A0B0"), Color.parseColor("#33FFFFFF")),
                  Theme("Glass", Color.parseColor("#B3000000"), Color.parseColor("#B3181822"), Color.parseColor("#FFFFFFFF"), Color.parseColor("#FFC0C0C8"), Color.parseColor("#55FFFFFF")),
                  Theme("Light", Color.parseColor("#FFFFFFFF"), Color.parseColor("#FFECECF2"), Color.parseColor("#FF111111"), Color.parseColor("#FF666672"), Color.parseColor("#22000000")),
                  Theme("Sunset", Color.parseColor("#FF3A1C71"), Color.parseColor("#FFD76D77"), Color.parseColor("#FFFFFFFF"), Color.parseColor("#FFE8D5F0"), Color.parseColor("#44FFFFFF")),
                  Theme("Ocean", Color.parseColor("#FF0F2027"), Color.parseColor("#FF2C5364"), Color.parseColor("#FFFFFFFF"), Color.parseColor("#FFB8D4E0"), Color.parseColor("#44FFFFFF")),
                  Theme("Black", Color.parseColor("#FF000000"), Color.parseColor("#FF000000"), Color.parseColor("#FFFFFFFF"), Color.parseColor("#FF9A9A9A"), Color.parseColor("#44FFFFFF"))
              )

              val accents = listOf(
                  "Green" to "#22DD55", "Blue" to "#4DA3FF", "Gold" to "#FFC857",
                  "Pink" to "#FF5FA2", "Purple" to "#B388FF", "White" to "#FFFFFF"
              )

              val currencies = listOf("€", "$", "£", "")

              fun parse(t: String?): Double? = t?.replace(',', '.')?.trim()?.toDoubleOrNull()

              fun money(cur: String, v: Double): String = cur + String.format(Locale.US, "%.2f", v)
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/example/boltoverlay
          cat > app/src/main/java/com/example/boltoverlay/MainActivity.kt <<'EOF_FILE'
          package com.example.boltoverlay

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.view.View
          import android.widget.AdapterView
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.HorizontalScrollView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.Spinner
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              private lateinit var prefs: SharedPreferences
              private lateinit var root: LinearLayout
              private lateinit var price: EditText
              private lateinit var km: EditText
              private lateinit var header: EditText
              private lateinit var priceChips: LinearLayout
              private lateinit var recentChips: LinearLayout
              private lateinit var statusChips: LinearLayout
              private var pad = 0

              private fun send(action: String? = "kyoto.UPDATE") {
                  val i = Intent(this, PillService::class.java)
                  if (action != null) i.action = action
                  startForegroundService(i)
              }

              private fun btn(t: String, f: () -> Unit): Button {
                  val b = Button(this)
                  b.text = t; b.isAllCaps = false
                  b.setOnClickListener { f() }
                  return b
              }

              private fun heading(t: String) {
                  val v = TextView(this)
                  v.text = t; v.textSize = 18f
                  v.setPadding(0, pad * 3 / 2, 0, pad / 4)
                  root.addView(v)
              }

              private fun label(t: String) {
                  val v = TextView(this)
                  v.text = t
                  root.addView(v)
              }

              private fun checkRow(text: String, key: String, def: Boolean) {
                  val c = CheckBox(this)
                  c.text = text; c.isChecked = prefs.getBoolean(key, def)
                  c.setOnCheckedChangeListener { _, v -> prefs.edit().putBoolean(key, v).apply(); send() }
                  root.addView(c)
              }

              private fun seek(label: String, lo: Int, hi: Int, key: String, def: Int, unit: String) {
                  val tv = TextView(this)
                  val sb = SeekBar(this)
                  sb.max = hi - lo
                  sb.progress = prefs.getInt(key, def) - lo
                  tv.text = "$label: ${prefs.getInt(key, def)}$unit"
                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) { tv.text = "$label: ${p + lo}$unit" }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {
                          prefs.edit().putInt(key, (s?.progress ?: 0) + lo).apply(); send()
                      }
                  })
                  root.addView(tv); root.addView(sb)
              }

              private fun choice(label: String, options: List<String>, key: String, def: Int) {
                  val tv = TextView(this)
                  tv.text = label
                  val sp = Spinner(this)
                  sp.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, options)
                  sp.setSelection(prefs.getInt(key, def))
                  sp.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(p: AdapterView<*>?, v: View?, pos: Int, id: Long) {
                          if (pos != prefs.getInt(key, def)) { prefs.edit().putInt(key, pos).apply(); send() }
                      }
                      override fun onNothingSelected(p: AdapterView<*>?) {}
                  }
                  root.addView(tv); root.addView(sp)
              }

              private fun chipRow(box: LinearLayout) {
                  box.orientation = LinearLayout.HORIZONTAL
                  val h = HorizontalScrollView(this)
                  h.addView(box)
                  root.addView(h)
              }

              private fun fillChips(box: LinearLayout, csv: String, onTap: (String) -> Unit) {
                  box.removeAllViews()
                  csv.split(",").map { it.trim() }.filter { it.isNotEmpty() }.forEach { v ->
                      box.addView(btn(v) { onTap(v) })
                  }
              }

              private fun showPill() {
                  val p = Cfg.parse(price.text.toString())
                  if (p == null || p <= 0) {
                      Toast.makeText(this, "Type a price first", Toast.LENGTH_LONG).show()
                      return
                  }
                  val hd = header.text.toString().trim().ifEmpty { "Active ride" }
                  prefs.edit().putString("price", price.text.toString().trim())
                      .putString("km", km.text.toString().trim())
                      .putString("header", hd)
                      .putBoolean("shown", true).apply()
                  saveRecent(price.text.toString().trim())
                  fillChips(recentChips, prefs.getString("recent", "") ?: "") { setPriceAndShow(it) }
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Allow 'Display over other apps' first", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      return
                  }
                  send("kyoto.SHOW")
              }

              private fun setPriceAndShow(v: String) {
                  price.setText(v)
                  showPill()
              }

              private fun saveRecent(p: String) {
                  val list = (prefs.getString("recent", "") ?: "").split(",").filter { it.isNotBlank() && it != p }
                  prefs.edit().putString("recent", (listOf(p) + list).take(8).joinToString(",")).apply()
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  prefs = getSharedPreferences(Cfg.FILE, MODE_PRIVATE)
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
                  pad = (16 * resources.displayMetrics.density).toInt()
                  root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(pad, pad, pad, pad)

                  val title = TextView(this)
                  title.text = "Kyoto"; title.textSize = 26f
                  root.addView(title)
                  label("Blue outline = drag the pill anywhere. Tap it (without dragging) to come back here. Use the notification buttons while driving.")
                  root.addView(btn("1. Allow display over other apps") {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  })

                  // ---------- ride ----------
                  heading("Ride")
                  price = EditText(this)
                  price.hint = "Price (e.g. 37)"; price.setSingleLine()
                  price.inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL
                  price.setText(prefs.getString("price", "") ?: "")
                  km = EditText(this)
                  km.hint = "Distance in km (optional)"; km.setSingleLine()
                  km.inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL
                  km.setText(prefs.getString("km", "") ?: "")
                  header = EditText(this)
                  header.hint = "Title on the pill"; header.setSingleLine()
                  header.setText(prefs.getString("header", "Active ride") ?: "Active ride")
                  root.addView(price); root.addView(km); root.addView(header)
                  root.addView(btn("2. Show pill") { showPill() })
                  root.addView(btn("Hide pill") { send(PillService.ACTION_HIDE) })

                  // ---------- titles ----------
                  heading("Quick titles")
                  statusChips = LinearLayout(this)
                  chipRow(statusChips)
                  val statusEdit = EditText(this)
                  statusEdit.hint = "Your titles, separated by commas"; statusEdit.setSingleLine()
                  statusEdit.setText(prefs.getString("statuses", "Active ride,Pickup,Waiting,Drop-off") ?: "")
                  root.addView(statusEdit)
                  fun rebuildStatus() {
                      fillChips(statusChips, prefs.getString("statuses", "Active ride,Pickup,Waiting,Drop-off") ?: "") { v ->
                          header.setText(v)
                          prefs.edit().putString("header", v).apply()
                          send()
                      }
                  }
                  rebuildStatus()
                  root.addView(btn("Save titles") {
                      prefs.edit().putString("statuses", statusEdit.text.toString()).apply(); rebuildStatus()
                  })

                  // ---------- quick prices ----------
                  heading("Quick prices (tap to show)")
                  priceChips = LinearLayout(this)
                  chipRow(priceChips)
                  val presetEdit = EditText(this)
                  presetEdit.hint = "Your prices, separated by commas"; presetEdit.setSingleLine()
                  presetEdit.setText(prefs.getString("presets", "10,15,20,30,37") ?: "")
                  root.addView(presetEdit)
                  fun rebuildPrices() {
                      fillChips(priceChips, prefs.getString("presets", "10,15,20,30,37") ?: "") { setPriceAndShow(it) }
                  }
                  rebuildPrices()
                  root.addView(btn("Save quick prices") {
                      prefs.edit().putString("presets", presetEdit.text.toString()).apply(); rebuildPrices()
                  })
                  label("Recent prices")
                  recentChips = LinearLayout(this)
                  chipRow(recentChips)
                  fillChips(recentChips, prefs.getString("recent", "") ?: "") { setPriceAndShow(it) }

                  // ---------- style ----------
                  heading("Style")
                  choice("Theme", Cfg.themes.map { it.name }, "theme", 0)
                  choice("Accent color", Cfg.accents.map { it.first }, "accent", 0)
                  choice("Currency", listOf("€  Euro", "$  Dollar", "£  Pound", "None"), "cur", 0)
                  seek("Size", 70, 170, "size", 100, "%")
                  seek("Opacity", 40, 100, "opacity", 95, "%")
                  seek("Corner roundness", 0, 40, "radius", 22, "")

                  heading("What to show")
                  checkRow("Title (e.g. Active ride)", "showHeader", true)
                  checkRow("Price per km (needs distance)", "showKm", true)

                  // ---------- position ----------
                  heading("Position")
                  val lock = CheckBox(this)
                  lock.text = "Lock position (touches go through to the app below)"
                  lock.isChecked = prefs.getBoolean("locked", false)
                  lock.setOnCheckedChangeListener { _, c -> prefs.edit().putBoolean("locked", c).apply(); send() }
                  root.addView(lock)
                  root.addView(btn("Reset position") { send(PillService.ACTION_RESET) })
                  root.addView(btn("Stop Kyoto completely") { send(PillService.ACTION_QUIT) })

                  val sv = ScrollView(this)
                  sv.addView(root)
                  setContentView(sv)
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/example/boltoverlay
          cat > app/src/main/java/com/example/boltoverlay/PillService.kt <<'EOF_FILE'
          package com.example.boltoverlay

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.IBinder
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import java.util.Locale
          import kotlin.math.abs

          class PillService : Service() {
              private lateinit var wm: WindowManager
              private lateinit var prefs: SharedPreferences
              private var pill: LinearLayout? = null

              override fun onBind(i: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  prefs = getSharedPreferences(Cfg.FILE, MODE_PRIVATE)
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("kyoto", "Kyoto", NotificationManager.IMPORTANCE_LOW))
                  startForeground(1, buildNotif())
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_HIDE -> prefs.edit().putBoolean("shown", false).apply()
                      ACTION_TOGGLE -> {
                          val now = prefs.getBoolean("shown", false)
                          if (!now && Cfg.parse(prefs.getString("price", "")) == null) {
                              Toast.makeText(this, "Open Kyoto and type a price first", Toast.LENGTH_LONG).show()
                          } else {
                              prefs.edit().putBoolean("shown", !now).apply()
                          }
                      }
                      ACTION_LOCKTOG -> prefs.edit().putBoolean("locked", !prefs.getBoolean("locked", false)).apply()
                      ACTION_RESET -> prefs.edit().remove("x").remove("y").apply()
                      ACTION_QUIT -> {
                          prefs.edit().putBoolean("shown", false).apply()
                          removePill(); stopSelf(); return START_NOT_STICKY
                      }
                  }
                  if (prefs.getBoolean("shown", false)) render() else removePill()
                  updateNotif()
                  return START_STICKY
              }

              private fun act(action: String, title: String, code: Int): Notification.Action {
                  val pi = PendingIntent.getService(
                      this, code, Intent(this, PillService::class.java).setAction(action),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  return Notification.Action.Builder(0, title, pi).build()
              }

              private fun buildNotif(): Notification {
                  val shown = prefs.getBoolean("shown", false)
                  val locked = prefs.getBoolean("locked", false)
                  val cur = Cfg.currencies[prefs.getInt("cur", 0).coerceIn(0, Cfg.currencies.size - 1)]
                  val price = Cfg.parse(prefs.getString("price", ""))
                  val text = if (shown && price != null) "Showing ${Cfg.money(cur, price)}" else "Pill hidden"
                  return Notification.Builder(this, "kyoto")
                      .setContentTitle("Kyoto")
                      .setContentText(text)
                      .setSmallIcon(android.R.drawable.ic_menu_info_details)
                      .setOngoing(true)
                      .addAction(act(ACTION_TOGGLE, if (shown) "Hide" else "Show", 1))
                      .addAction(act(ACTION_LOCKTOG, if (locked) "Unlock" else "Lock", 2))
                      .build()
              }

              private fun updateNotif() {
                  getSystemService(NotificationManager::class.java).notify(1, buildNotif())
              }

              private fun removePill() {
                  pill?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  pill = null
              }

              private fun render() {
                  removePill()
                  val price = Cfg.parse(prefs.getString("price", "")) ?: return
                  val cur = Cfg.currencies[prefs.getInt("cur", 0).coerceIn(0, Cfg.currencies.size - 1)]
                  val theme = Cfg.themes[prefs.getInt("theme", 0).coerceIn(0, Cfg.themes.size - 1)]
                  val accent = Color.parseColor(Cfg.accents[prefs.getInt("accent", 0).coerceIn(0, Cfg.accents.size - 1)].second)
                  val locked = prefs.getBoolean("locked", false)
                  val sc = prefs.getInt("size", 100) / 100f
                  val opac = prefs.getInt("opacity", 95) / 100f
                  val radius = prefs.getInt("radius", 22)
                  val dm = resources.displayMetrics

                  fun d(v: Float): Int = (v * sc * dm.density).toInt()
                  fun sz(v: Float): Float = v * sc

                  fun label(text: CharSequence, size: Float, color: Int, bold: Boolean = false): TextView {
                      val t = TextView(this)
                      t.text = text; t.textSize = sz(size); t.setTextColor(color)
                      if (bold) t.setTypeface(null, Typeface.BOLD)
                      return t
                  }

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.gravity = Gravity.CENTER_HORIZONTAL
                  root.setPadding(d(22f), d(12f), d(22f), d(12f))
                  root.minimumWidth = d(150f)
                  root.alpha = opac
                  val bg = GradientDrawable(GradientDrawable.Orientation.TL_BR, intArrayOf(theme.bg1, theme.bg2))
                  bg.cornerRadius = d(radius.toFloat()).toFloat()
                  if (!locked) bg.setStroke((2 * dm.density).toInt(), accent) else bg.setStroke(1, theme.stroke)
                  root.background = bg

                  if (prefs.getBoolean("showHeader", true)) {
                      val header = label((prefs.getString("header", "Active ride") ?: "").uppercase(Locale.getDefault()), 11f, accent, true)
                      header.letterSpacing = 0.14f
                      root.addView(header)
                  }

                  root.addView(label(Cfg.money(cur, price), 34f, theme.text, true))

                  val km = Cfg.parse(prefs.getString("km", ""))
                  if (prefs.getBoolean("showKm", true) && km != null && km > 0) {
                      root.addView(label("${Cfg.money(cur, price / km)} per km", 12f, theme.muted))
                  }

                  var flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                  if (locked) flags = flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE // touches pass through

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, flags, PixelFormat.TRANSLUCENT
                  )
                  params.gravity = Gravity.TOP or Gravity.START
                  params.x = prefs.getInt("x", dm.widthPixels / 2 - (80 * dm.density).toInt())
                  params.y = prefs.getInt("y", dm.heightPixels * 12 / 100)

                  if (!locked) {
                      var startX = 0; var startY = 0
                      var downX = 0f; var downY = 0f
                      var moved = false
                      root.setOnTouchListener { v, e ->
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  startX = params.x; startY = params.y
                                  downX = e.rawX; downY = e.rawY; moved = false
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val ox = (e.rawX - downX).toInt(); val oy = (e.rawY - downY).toInt()
                                  if (abs(ox) > 12 || abs(oy) > 12) moved = true
                                  params.x = startX + ox; params.y = startY + oy
                                  try { wm.updateViewLayout(v, params) } catch (_: Exception) {}
                              }
                              MotionEvent.ACTION_UP -> {
                                  if (moved) {
                                      prefs.edit().putInt("x", params.x).putInt("y", params.y).apply()
                                  } else {
                                      startActivity(Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                                  }
                              }
                          }
                          true
                      }
                  }

                  try {
                      wm.addView(root, params)
                      pill = root
                  } catch (_: Exception) {
                      Toast.makeText(this, "Please allow 'Display over other apps' for Kyoto", Toast.LENGTH_LONG).show()
                  }
              }

              override fun onDestroy() {
                  removePill()
                  super.onDestroy()
              }

              companion object {
                  const val ACTION_HIDE = "kyoto.HIDE"
                  const val ACTION_RESET = "kyoto.RESET"
                  const val ACTION_TOGGLE = "kyoto.TOGGLE"
                  const val ACTION_LOCKTOG = "kyoto.LOCKTOG"
                  const val ACTION_QUIT = "kyoto.QUIT"
              }
          }
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Kyoto"
          include(":app")
          EOF_FILE
      - name: Build
        working-directory: Kyoto
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Kyoto-apk
          path: Kyoto/app/build/outputs/apk/debug/app-debug.apk
